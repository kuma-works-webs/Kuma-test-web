<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111111">
<title>My Shop</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#080808;
  --surface:#111;
  --surface2:#181818;
  --line:#292929;
  --text:#fff;
  --muted:#aaa;
  --primary:#111;
  --primary2:#333;
  --danger:#ef4444;
  --success:#22c55e;
  --radius:18px;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:Inter,Arial,sans-serif;
  color:var(--text);
  background:var(--bg);
  overflow-x:hidden;
}

body:before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-5;
  background:
    radial-gradient(circle at 15% 20%,rgba(255,255,255,.06),transparent 30%),
    radial-gradient(circle at 85% 70%,rgba(255,255,255,.04),transparent 35%);
}

#backgroundVideo{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-6;
  display:none;
}

#backgroundOverlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:-4;
  display:none;
}

button,input,textarea,select{font:inherit}

button{cursor:pointer}

a{
  color:inherit;
  text-decoration:none;
}

.container{
  width:min(1180px,calc(100% - 30px));
  margin:auto;
}

header{
  position:sticky;
  top:0;
  z-index:50;
  backdrop-filter:blur(18px);
  background:rgba(8,8,8,.78);
  border-bottom:1px solid rgba(255,255,255,.08);
}

.nav{
  height:70px;
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  font-size:19px;
  margin-right:auto;
}

.logo img{
  width:38px;
  height:38px;
  object-fit:contain;
  border-radius:10px;
}

.navlinks{
  display:flex;
  gap:6px;
}

.navbtn{
  border:0;
  padding:10px 13px;
  border-radius:11px;
  background:transparent;
  color:var(--muted);
}

.navbtn:hover{
  background:var(--surface2);
  color:#fff;
}

.cartbtn{
  background:var(--primary);
  color:#fff!important;
}

.badge{
  display:inline-grid;
  place-items:center;
  min-width:20px;
  height:20px;
  padding:0 5px;
  border-radius:20px;
  background:#fff;
  color:#111;
  font-size:11px;
  font-weight:800;
  margin-left:4px;
}

.announcement{
  display:none;
  text-align:center;
  padding:9px;
  background:var(--primary);
  color:#fff;
  font-size:13px;
  font-weight:700;
}

.hero{
  min-height:520px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  position:relative;
  overflow:hidden;
}

#heroVideo{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:-2;
  display:none;
}

.heroOverlay{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.38);
  z-index:-1;
}

.heroContent{
  padding:90px 0;
  max-width:850px;
}

.eyebrow{
  display:inline-block;
  padding:8px 13px;
  border:1px solid var(--line);
  border-radius:50px;
  color:var(--muted);
  font-size:13px;
}

.hero h1{
  font-size:clamp(42px,7vw,78px);
  line-height:1;
  letter-spacing:-.055em;
  margin:18px 0;
}

.hero p{
  color:var(--muted);
  max-width:650px;
  margin:0 auto 28px;
  line-height:1.7;
}

.heroActions{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
}

.btn{
  border:0;
  padding:13px 18px;
  border-radius:13px;
  font-weight:700;
  transition:.25s;
}

.btn:hover{
  transform:translateY(-2px);
}

.primary{
  background:var(--primary);
  color:#fff;
}

.secondary{
  background:var(--surface2);
  color:#fff;
  border:1px solid var(--line);
}

.danger{
  background:#381414;
  color:#ff8d8d;
}

.section{
  padding:35px 0 75px;
}

.sectionhead{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:22px;
}

.sectionhead h2{
  margin:0;
  font-size:29px;
}

.grow{flex:1}

.search{
  display:flex;
  gap:8px;
  align-items:center;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:13px;
  padding:10px 13px;
  min-width:280px;
}

.search input{
  width:100%;
  background:transparent;
  border:0;
  outline:0;
  color:#fff;
}

.filters{
  display:flex;
  gap:8px;
  overflow:auto;
  padding-bottom:8px;
  margin-bottom:20px;
}

.chip{
  white-space:nowrap;
  padding:9px 13px;
  border-radius:50px;
  background:var(--surface);
  color:var(--muted);
  border:1px solid var(--line);
}

.chip.active,
.chip:hover{
  background:var(--primary);
  color:#fff;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:17px;
}

.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  transition:.3s;
}

.card:hover{
  transform:translateY(-5px);
}

.productImg{
  height:250px;
  background:var(--surface2);
  position:relative;
  overflow:hidden;
}

.productImg img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.4s;
}

.card:hover .productImg img{
  transform:scale(1.05);
}

.badges{
  position:absolute;
  top:11px;
  left:11px;
  display:flex;
  gap:6px;
}

.tag{
  background:rgba(0,0,0,.75);
  padding:6px 9px;
  border-radius:8px;
  font-size:11px;
  font-weight:800;
}

.wish{
  position:absolute;
  right:11px;
  top:11px;
  width:38px;
  height:38px;
  border-radius:50%;
  border:0;
  background:rgba(0,0,0,.7);
  color:#fff;
  font-size:19px;
}

.wish.active{
  color:#ff4d83;
}

.cardbody{
  padding:16px;
}

.card h3{
  margin:0 0 7px;
}

.desc{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
  min-height:39px;
}

.price{
  font-size:20px;
  font-weight:800;
  margin:13px 0;
}

.old{
  text-decoration:line-through;
  color:var(--muted);
  font-size:13px;
  margin-right:6px;
}

.stock{
  color:var(--muted);
  font-size:12px;
  margin-bottom:11px;
}

.low{color:#f59e0b}
.out{color:#ef4444}

.cardfoot{
  display:flex;
  gap:8px;
}

.cardfoot .btn{
  flex:1;
}

.empty{
  text-align:center;
  padding:55px 15px;
  color:var(--muted);
  border:1px dashed var(--line);
  border-radius:17px;
  grid-column:1/-1;
}

footer{
  border-top:1px solid var(--line);
  padding:40px 0;
  color:var(--muted);
}

.footergrid{
  display:flex;
  justify-content:space-between;
  gap:25px;
  flex-wrap:wrap;
}

.footerbrand{
  color:#fff;
  font-weight:800;
  margin-bottom:5px;
}

.socials{
  display:flex;
  gap:8px;
}

.socials a{
  padding:8px 11px;
  border:1px solid var(--line);
  border-radius:10px;
}

/* MODALS */

.overlay{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:rgba(0,0,0,.7);
  backdrop-filter:blur(8px);
}

.overlay.show{
  display:flex;
}

.modal{
  width:min(700px,100%);
  max-height:93vh;
  overflow:auto;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:20px;
}

.modal.large{
  width:min(1050px,100%);
}

.modalhead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:17px 20px;
  border-bottom:1px solid var(--line);
}

.modalhead h3{
  margin:0;
}

.close{
  width:36px;
  height:36px;
  border:0;
  border-radius:10px;
  background:var(--surface2);
  color:#fff;
}

.modalbody{
  padding:20px;
}

.field{
  margin-bottom:14px;
}

.field label{
  display:block;
  color:var(--muted);
  font-size:11px;
  font-weight:800;
  margin-bottom:7px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  padding:12px;
  border-radius:11px;
  border:1px solid var(--line);
  background:#0b0b0b;
  color:#fff;
  outline:0;
}

.field textarea{
  min-height:90px;
  resize:vertical;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.modalActions{
  display:flex;
  justify-content:flex-end;
  gap:9px;
  margin-top:18px;
}

.filelabel{
  display:flex!important;
  justify-content:center;
  align-items:center;
  padding:13px;
  border:1px dashed var(--line);
  border-radius:11px;
  cursor:pointer;
  color:var(--muted);
}

.filelabel:hover{
  border-color:#fff;
  color:#fff;
}

.preview{
  width:100%;
  max-height:180px;
  object-fit:cover;
  border-radius:11px;
  margin-top:8px;
  background:var(--surface2);
}

.videoPreview{
  width:100%;
  max-height:250px;
  border-radius:12px;
  margin-top:8px;
  background:#000;
}

.cartrow{
  display:grid;
  grid-template-columns:65px 1fr auto;
  gap:12px;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid var(--line);
}

.cartimg{
  width:65px;
  height:65px;
  object-fit:cover;
  border-radius:11px;
  background:var(--surface2);
}

.qty{
  display:flex;
  align-items:center;
  gap:7px;
}

.qty button{
  width:29px;
  height:29px;
  border:0;
  border-radius:8px;
  background:var(--surface2);
  color:#fff;
}

.carttotal{
  display:flex;
  justify-content:space-between;
  padding-top:17px;
  font-size:20px;
  font-weight:800;
}

.review{
  padding:15px;
  border:1px solid var(--line);
  border-radius:14px;
  background:rgba(255,255,255,.02);
}

.stars{
  color:#fbbf24;
  letter-spacing:2px;
}

.muted{
  color:var(--muted);
}

/* ADMIN */

.admin{
  width:min(1200px,100%);
  height:min(850px,94vh);
  display:grid;
  grid-template-columns:220px 1fr;
  overflow:hidden;
}

.adminSide{
  background:#090909;
  border-right:1px solid var(--line);
  padding:18px;
}

.adminSide h2{
  font-size:17px;
  margin:8px 10px 20px;
}

.adminNav{
  display:grid;
  gap:5px;
}

.adminNav button{
  text-align:left;
  padding:11px 12px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:var(--muted);
}

.adminNav button.active,
.adminNav button:hover{
  background:var(--surface2);
  color:#fff;
}

.adminMain{
  overflow:auto;
  background:var(--surface);
  padding:22px;
}

.adminPage{
  display:none;
}

.adminPage.active{
  display:block;
}

.stats{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:11px;
  margin-bottom:22px;
}

.stat{
  padding:15px;
  background:var(--surface2);
  border:1px solid var(--line);
  border-radius:14px;
}

.stat small{
  color:var(--muted);
}

.stat strong{
  display:block;
  font-size:25px;
  margin-top:7px;
}

.tablewrap{
  overflow:auto;
  border:1px solid var(--line);
  border-radius:14px;
}

.table{
  width:100%;
  min-width:700px;
  border-collapse:collapse;
}

.table th,
.table td{
  padding:12px;
  text-align:left;
  border-bottom:1px solid var(--line);
  font-size:13px;
}

.table th{
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
}

.actions{
  display:flex;
  gap:6px;
}

.mini{
  border:0;
  border-radius:8px;
  padding:8px 10px;
  background:var(--surface2);
  color:#fff;
}

.settingsGrid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.settingCard{
  border:1px solid var(--line);
  border-radius:15px;
  padding:15px;
  background:rgba(255,255,255,.02);
}

.settingCard h4{
  margin:0 0 14px;
}

.productAdminSearch{
  margin-bottom:15px;
}

.toastbox{
  position:fixed;
  right:16px;
  bottom:16px;
  z-index:500;
  display:grid;
  gap:8px;
}

.toast{
  padding:13px 16px;
  background:#151515;
  border:1px solid var(--line);
  border-radius:12px;
  box-shadow:0 15px 40px rgba(0,0,0,.4);
}

@media(max-width:950px){
  .grid{
    grid-template-columns:repeat(3,1fr);
  }

  .stats{
    grid-template-columns:repeat(3,1fr);
  }
}

@media(max-width:700px){
  .navlinks .optional{
    display:none;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }

  .productImg{
    height:210px;
  }

  .sectionhead{
    align-items:stretch;
    flex-direction:column;
  }

  .search{
    min-width:0;
  }

  .row,
  .settingsGrid{
    grid-template-columns:1fr;
  }

  .admin{
    grid-template-columns:1fr;
    height:94vh;
  }

  .adminSide{
    border-right:0;
    border-bottom:1px solid var(--line);
    padding:10px;
  }

  .adminSide h2{
    display:none;
  }

  .adminNav{
    display:flex;
    overflow:auto;
  }

  .adminNav button{
    white-space:nowrap;
  }

  .adminMain{
    padding:14px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:450px){
  .grid{
    grid-template-columns:1fr;
  }

  .productImg{
    height:260px;
  }

  .hero h1{
    font-size:43px;
  }
}
</style>
</head>

<body>

<video id="backgroundVideo" autoplay muted loop playsinline></video>
<div id="backgroundOverlay"></div>

<div id="announcement" class="announcement"></div>

<header>
  <div class="container nav">

    <a href="#" class="logo">
      <img id="logoImg" style="display:none">
      <span id="logoEmoji">🛍️</span>
      <span id="shopName">My Shop</span>
    </a>

    <nav class="navlinks">
      <button class="navbtn optional" onclick="scrollProducts()">Shop</button>
      <button class="navbtn optional" onclick="openModal('contactModal')">Contact</button>
      <button class="navbtn" onclick="openModal('adminLogin')">Admin</button>
      <button class="navbtn cartbtn" onclick="openCart()">
        Cart <span class="badge" id="cartCount">0</span>
      </button>
    </nav>

  </div>
</header>


<main>

<section class="hero">

  <video id="heroVideo" autoplay muted loop playsinline></video>

  <div class="heroOverlay"></div>

  <div class="container heroContent">

    <div class="eyebrow" id="heroEyebrow">
      NEW COLLECTION
    </div>

    <h1 id="heroTitle">
      Welcome to our shop
    </h1>

    <p id="heroText">
      Discover our latest products.
    </p>

    <div class="heroActions">
      <button class="btn primary" id="heroButton" onclick="scrollProducts()">
        Shop Now
      </button>

      <button class="btn secondary" onclick="openModal('contactModal')">
        Contact
      </button>
    </div>

  </div>

</section>


<section class="section" id="productsSection">

  <div class="container">

    <div class="sectionhead">

      <h2 id="productsTitle">
        Our Products
      </h2>

      <div class="grow"></div>

      <div class="search">
        🔎
        <input
          id="searchInput"
          placeholder="Search products..."
          oninput="renderProducts()"
        >
        <button
          onclick="clearSearch()"
          style="background:none;color:#aaa;border:0"
        >
          ✕
        </button>
      </div>

    </div>

    <div id="categoryFilters" class="filters"></div>

    <div id="productGrid" class="grid"></div>

  </div>

</section>


<section
  class="section"
  id="reviewsSection"
  style="display:none"
>

  <div class="container">

    <div class="sectionhead">
      <h2>Customer Reviews</h2>
      <div class="grow"></div>
      <button class="btn primary" onclick="openReviewModal()">
        Leave a review
      </button>
    </div>

    <div
      id="reviewsList"
      style="display:grid;gap:10px"
    ></div>

  </div>

</section>

</main>


<footer>

  <div class="container footergrid">

    <div>
      <div class="footerbrand" id="footerName">
        My Shop
      </div>

      <div id="footerText">
        Thanks for shopping with us.
      </div>
    </div>

    <div
      class="socials"
      id="socials"
    ></div>

    <div id="contactFooter"></div>

  </div>

</footer>


<!-- CART -->

<div class="overlay" id="cartModal">

  <div class="modal">

    <div class="modalhead">
      <h3>Your Cart</h3>
      <button class="close" onclick="closeModal('cartModal')">✕</button>
    </div>

    <div class="modalbody">

      <div id="cartItems"></div>

      <div class="carttotal">
        <span>Total</span>
        <span id="cartTotal">0 DH</span>
      </div>

      <div class="modalActions">

        <button
          class="btn secondary"
          onclick="closeModal('cartModal')"
        >
          Continue shopping
        </button>

        <button
          class="btn primary"
          onclick="startCheckout()"
        >
          Checkout
        </button>

      </div>

    </div>

  </div>

</div>


<!-- CHECKOUT -->

<div class="overlay" id="checkoutModal">

  <div class="modal">

    <div class="modalhead">
      <h3>Checkout</h3>
      <button class="close" onclick="closeModal('checkoutModal')">✕</button>
    </div>

    <div class="modalbody">

      <div class="row">

        <div class="field">
          <label>FULL NAME</label>
          <input id="customerName">
        </div>

        <div class="field">
          <label>PHONE</label>
          <input id="customerPhone">
        </div>

      </div>

      <div class="field">
        <label>ADDRESS</label>
        <textarea id="customerAddress"></textarea>
      </div>

      <div class="row">

        <div class="field">
          <label>CITY</label>
          <input id="customerCity">
        </div>

        <div class="field">
          <label>NOTE</label>
          <input id="customerNote">
        </div>

      </div>

      <p
        id="paymentNote"
        class="muted"
      ></p>

      <div class="modalActions">

        <button
          class="btn secondary"
          onclick="closeModal('checkoutModal')"
        >
          Back
        </button>

        <button
          class="btn primary"
          onclick="placeOrder()"
        >
          Place Order
        </button>

      </div>

    </div>

  </div>

</div>


<!-- ORDER SUCCESS -->

<div class="overlay" id="successModal">

  <div class="modal">

    <div style="padding:40px;text-align:center">

      <div style="font-size:55px">✓</div>

      <h2>Order received!</h2>

      <p class="muted">
        Your order number:
      </p>

      <h2 id="orderNumber">—</h2>

      <button
        class="btn primary"
        onclick="closeModal('successModal')"
      >
        Done
      </button>

    </div>

  </div>

</div>


<!-- CONTACT -->

<div class="overlay" id="contactModal">

  <div class="modal">

    <div class="modalhead">
      <h3>Contact Us</h3>
      <button class="close" onclick="closeModal('contactModal')">✕</button>
    </div>

    <div
      class="modalbody"
      id="contactBody"
    ></div>

  </div>

</div>


<!-- PRODUCT DETAILS -->

<div class="overlay" id="productModal">

  <div class="modal">

    <div class="modalhead">

      <h3 id="detailName">
        Product
      </h3>

      <button
        class="close"
        onclick="closeModal('productModal')"
      >
        ✕
      </button>

    </div>

    <div
      class="modalbody"
      id="productDetail"
    ></div>

  </div>

</div>


<!-- REVIEW -->

<div class="overlay" id="reviewModal">

  <div class="modal">

    <div class="modalhead">

      <h3>Leave a Review</h3>

      <button
        class="close"
        onclick="closeModal('reviewModal')"
      >
        ✕
      </button>

    </div>

    <div class="modalbody">

      <div class="field">
        <label>YOUR NAME</label>
        <input id="reviewName">
      </div>

      <div class="field">
        <label>RATING</label>
